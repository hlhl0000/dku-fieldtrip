<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 — 단국대 현장체험학습</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login">
<main id="app">
  <header class="app-header">
    <h1>단국대 현장체험학습</h1>
    <p class="sub">모둠 미션 · 인생네컷</p>
  </header>

  <!-- 반 select는 없다. 반 ID는 학번 앞 3자리에서 파생한다(§3-0 ⑸) —
       10401 → 1학년 4반. 학생이 고를 것이 하나 줄고, 잘못 고를 길도 사라진다. -->
  <section id="login-card" class="card">
    <form id="login-form" novalidate>
      <div class="field">
        <label for="sid-input">학번 5자리</label>
        <input id="sid-input" name="sid" type="text" inputmode="numeric"
               autocomplete="off" maxlength="5" placeholder="예: 10401" required>
      </div>

      <div class="field">
        <label for="pin-input">PIN 4자리</label>
        <input id="pin-input" name="pin" type="password" inputmode="numeric"
               autocomplete="off" maxlength="4" required>
      </div>

      <p id="login-error" class="error" role="alert" hidden></p>

      <button id="login-submit" type="submit">시작하기</button>
      <p class="note">선생님이 나눠 준 PIN 쪽지의 4자리를 그대로 넣으세요. 미션 화면과 사후 설문에 함께 쓰입니다.</p>
    </form>
  </section>

  <section id="mode-note" class="note">
    <p id="mode-text"></p>
  </section>
</main>

<script type="module">
import { MODE, renderInitError, renderPersistenceBanner } from './js/firebase-config.js';
import { db, CREDENTIAL_ERROR_TEXT } from './js/db.js';
import { knownClassIdOfSid, saveSession, setText, registerServiceWorker, loadSession } from './js/common.js';

const app = document.getElementById('app');
const form = document.getElementById('login-form');
const sidInput = document.getElementById('sid-input');
const pinInput = document.getElementById('pin-input');
const errorBox = document.getElementById('login-error');
const submitBtn = document.getElementById('login-submit');

setText(document.getElementById('mode-text'),
  MODE === 'demo'
    ? '지금은 데모 모드입니다. 이 기기 안에서만 동작하며 서버로 아무것도 보내지 않습니다.'
    : '서버 모드입니다.');

function showError(message) {
  setText(errorBox, message);
  errorBox.hidden = false;
}

function hideError() {
  errorBox.hidden = true;
  setText(errorBox, '');
}

// 앱 셸을 캐시해 둔다. 행사 아침에 온라인으로 한 번 열어 두는 것이 운영 전제다.
registerServiceWorker();

// 시작 준비. 지속 캐시(IndexedDB) 초기화가 막히면 원인과 선택지를 함께 보여 준다(§2-8).
// 실패해도 데모 모드로 자동 전환하지 않는다(§5 금지 10).
(async function boot() {
  let ready = null;
  try {
    ready = await db.ensureReady();
  } catch (e) {
    if (e && e.kind === 'persistence') {
      renderInitError(app, {
        kind: 'persistence',
        detail: e.message,
        onRetry: function () { location.reload(); },
        onMemoryCache: function () {
          localStorage.setItem('dku:memoryCache', '1');
          location.reload();
        }
      });
    } else {
      renderInitError(app, {
        kind: 'fatal',
        detail: e && e.message ? e.message : String(e),
        onRetry: function () { location.reload(); }
      });
    }
    return;
  }
  // 지속 캐시를 양성 확인하지 못했으면 오류 화면이 아니라 상시 배너를 띄운다(§2-8 · A-4).
  if (ready && ready.offlineProtection === false) renderPersistenceBanner(app);
  // 이미 로그인한 기기는 바로 미션 화면으로 보낸다.
  // 판정 기준은 `classId && sid`다 — **모둠 미배정(gid='')도 로그인 상태**이므로
  // gid를 조건에 넣으면 미배정 학생만 로그인 화면에 갇힌다(§1-1 #14 · §3-0 ⑵-b).
  const s = loadSession();
  if (s && s.classId && s.sid) location.replace('mission.html');
})();

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  hideError();
  const sid = sidInput.value.trim();
  const pin = pinInput.value.trim();
  // 반 ID는 학번에서 파생하고 **파생 직후 등재 여부를 대조한다**(§3-0 ⑸ · 재검 N-8).
  // 미등재 반은 자격 오류와 같은 문면으로 거부한다 — 「그 반은 없습니다」라고 답하면
  // 어느 반이 운영 중인지 알려 주는 채널이 된다.
  const classId = knownClassIdOfSid(sid);
  if (!classId) {
    showError(CREDENTIAL_ERROR_TEXT);
    pinInput.value = '';
    return;
  }
  submitBtn.disabled = true;
  try {
    const session = await db.login(classId, sid, pin);
    saveSession({
      classId: session.classId,
      sid: session.sid,
      name: session.name,
      gid: session.gid,
      groupNo: session.groupNo,
      email: session.email,
      courseRev: session.courseRev
    });
    location.href = 'mission.html';
  } catch (err) {
    showError(err && err.message ? err.message : '로그인하지 못했습니다');
    pinInput.value = '';
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
