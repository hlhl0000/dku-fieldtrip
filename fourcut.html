<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인생네컷 — 단국대 현장체험학습</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 이 화면 전용 규칙만 둔다(공용 규칙은 css/style.css). v3.2 확정 24 셀 조정 UI. */
  .adjust-cell { margin: 0 0 18px; }
  .adjust-cell:last-child { margin-bottom: 0; }
  .adjust-title { margin: 0 0 6px; font-weight: 700; font-size: 0.95rem; }

  /* 셀 미리보기 상자. 높이(= 폭 × 480/640)는 스크립트가 직접 넣는다.
     percent padding은 부모 폭 기준이라 max-width가 걸리면 비율이 어긋나고,
     aspect-ratio는 구형 iOS Safari에서 못 쓴다. */
  .adjust-view {
    position: relative;
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    border-radius: 8px;
    background: #000;
    touch-action: none;          /* 끌기 중 페이지가 함께 스크롤되지 않게 한다 */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .adjust-view.dragging { cursor: grabbing; }
  .adjust-view > img {
    position: absolute;
    pointer-events: none;
    -webkit-user-drag: none;
    /* style.css의 `img { max-width: 100% }`가 확대·이동한 폭을 상자 폭으로 깎는다.
       여기서만 풀어 준다 — 잘라 채우기의 넘치는 부분이 잘려 검은 띠가 생기던 자리다. */
    max-width: none;
  }
  /* 「전체 담기」의 흐린 배경 미리보기. 산출물의 흐림은 fourcut.js가 캔버스로 그린다. */
  .adjust-bg {
    left: -8%; top: -8%; width: 116%; height: 116%;
    object-fit: cover;
    filter: blur(12px);
  }
  .adjust-controls { margin-top: 8px; }
  .adjust-controls .button-row { margin: 0 0 6px; }
  .adjust-controls button[aria-pressed="true"] { outline: 3px solid #2f6fd0; }
  .adjust-scale { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  .adjust-scale input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .adjust-scale .adjust-scale-value { flex: 0 0 auto; min-width: 3.5em; text-align: right; }
</style>
</head>
<body class="page-fourcut">
<main id="app">
  <header class="app-header">
    <h1>인생네컷</h1>
    <p class="sub">장소 순서대로 놓인 사진 중 <strong>4장</strong>을 고르세요.</p>
  </header>

  <p id="not-enough" class="error" role="alert" hidden></p>
  <p id="compose-error" class="error" role="alert" hidden></p>

  <section class="card" id="pick-card">
    <p class="note" id="pick-count">고른 사진 0 / 4</p>
    <ul id="pick-list" class="pick-grid"></ul>
  </section>

  <!-- 셀별 자를 범위 조정 (확정 24). 4장을 고른 뒤에만 열린다.
       조정값은 이 기기의 이 화면에서만 쓰이고 서버에 저장하지 않는다(§5 금지 18). -->
  <section class="card" id="adjust-card" hidden>
    <h2 class="section-title">자를 범위 조정</h2>
    <p class="note">사진을 끌어 위치를 옮기고, 슬라이더로 크기를 바꿉니다.
      「잘라 채우기」는 칸에 꽉 채우고, 「전체 담기」는 사진 전체를 넣고 남는 자리를 흐린 배경으로 메웁니다.
      조정한 값은 이 기기에만 남고 저장되지 않습니다.</p>
    <div id="adjust-list"></div>
  </section>

  <section class="card">
    <h2 class="section-title">프레임</h2>
    <div id="frame-row" class="frame-row"></div>
    <button id="make-btn" type="button" disabled>네컷 만들기</button>
  </section>

  <section class="card" id="result-card" hidden>
    <h2 class="section-title">완성</h2>
    <img id="fourcut-preview" alt="완성된 네컷 미리보기">
    <p class="note" id="result-size"></p>
    <div class="button-row">
      <button id="save-share" type="button">공유로 저장</button>
      <button id="save-download" type="button">파일로 내려받기</button>
      <button id="save-newtab" type="button">새 탭에서 열기</button>
    </div>
    <p id="save-result" class="note" role="status"></p>
    <button id="remake-btn" type="button" class="secondary">다시 만들기</button>
  </section>

  <section class="card">
    <a class="link-button" href="mission.html">미션 화면으로</a>
  </section>
</main>

<script type="module">
import { db } from './js/db.js';
import {
  composeFourcut, fileNameFor, OUTPUT,
  CELL, ADJUST, cellRect, newAdjust
} from './js/fourcut.js';
import { FRAMES, DEFAULT_FRAME_TEXTS } from './frames/frames.js';
import {
  requireLogin, setText, el, clear, registerServiceWorker, statusText
} from './js/common.js';

const session = requireLogin();
const list = document.getElementById('pick-list');
const countEl = document.getElementById('pick-count');
const notEnough = document.getElementById('not-enough');
const composeError = document.getElementById('compose-error');
const makeBtn = document.getElementById('make-btn');
const resultCard = document.getElementById('result-card');
const preview = document.getElementById('fourcut-preview');
const resultSize = document.getElementById('result-size');
const saveResult = document.getElementById('save-result');
const frameRow = document.getElementById('frame-row');
const adjustCard = document.getElementById('adjust-card');
const adjustList = document.getElementById('adjust-list');

registerServiceWorker();

const NEED = 4;
let photos = [];
let selected = [];          // 선택 순서 보존. 합성 직전 locIndex 오름차순으로 정렬한다.
const dimsByLoc = {};       // locIndex → {w, h} 실픽셀. 자동 모드 판정과 미리보기에 쓴다.
const adjustByLoc = {};     // locIndex → 조정값. 선택을 껐다 켜도 유지된다(서버 저장 없음).
let adjustCells = [];       // 지금 그려진 조정 칸 4개의 DOM·상태
let frameId = FRAMES[0].id;
let frameTexts = DEFAULT_FRAME_TEXTS;
let lastResult = null;      // 마지막으로 성공한 {blob, dataUrl} — 실패해도 버리지 않는다
let lastObjectUrl = null;

function showError(node, text) {
  setText(node, text);
  node.hidden = !text;
}

function renderFrames() {
  clear(frameRow);
  FRAMES.forEach(function (f) {
    const b = el('button', 'secondary', f.name);
    b.type = 'button';
    b.id = 'frame-' + f.id;
    b.setAttribute('aria-pressed', String(f.id === frameId));
    b.addEventListener('click', function () {
      frameId = f.id;
      renderFrames();
    });
    frameRow.appendChild(b);
  });
}

function renderPicks() {
  clear(list);
  photos.forEach(function (p) {
    const item = el('li', 'pick-item');
    item.setAttribute('data-loc', String(p.locIndex));
    const isSel = selected.indexOf(p.locIndex) >= 0;
    if (isSel) item.classList.add('selected');
    const full = selected.length >= NEED && !isSel;
    if (full) item.classList.add('disabled');
    item.setAttribute('aria-pressed', String(isSel));

    const img = document.createElement('img');
    img.src = 'data:' + p.mime + ';base64,' + p.full;
    img.alt = p.name + ' 인증사진';
    item.appendChild(img);

    const label = el('div', 'pick-label');
    const order = el('span', 'pick-order', isSel ? String(selected.indexOf(p.locIndex) + 1) : '·');
    label.appendChild(order);
    label.appendChild(document.createTextNode(' ' + (p.locIndex + 1) + '. ' + p.name));
    item.appendChild(label);

    if (p.status !== 'synced') {
      item.appendChild(el('div', 'pick-label', statusText(p.status)));
    }

    item.addEventListener('click', function () { toggle(p.locIndex); });
    list.appendChild(item);
  });

  setText(countEl, '고른 사진 ' + selected.length + ' / ' + NEED);
  makeBtn.disabled = selected.length !== NEED;

  // 4장이 모이면 셀별 조정 칸을 연다(확정 24-⑴).
  if (selected.length === NEED) {
    buildAdjust();
  } else {
    adjustCells = [];
    clear(adjustList);
    adjustCard.hidden = true;
  }
}

// ── 셀별 자를 범위 조정 (확정 24) ─────────────────────────────────────────

// 사진의 실픽셀을 읽는다. 셀(640×480)보다 작은지가 자동 모드 판정의 기준이다(확정 24-⑶).
function loadDims(p) {
  return new Promise(function (resolve) {
    const img = new Image();
    img.onload = function () { resolve({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = function () { resolve({ w: CELL.w, h: CELL.h }); };
    img.src = 'data:' + p.mime + ';base64,' + p.full;
  });
}

function adjustFor(locIndex) {
  const d = dimsByLoc[locIndex] || { w: CELL.w, h: CELL.h };
  if (!adjustByLoc[locIndex]) adjustByLoc[locIndex] = newAdjust(d.w, d.h);
  return adjustByLoc[locIndex];
}

// 미리보기 상자와 합성 캔버스가 같은 cellRect()를 쓴다. 상자 폭 / 640 이 축척이다.
function paintCell(c) {
  // 아직 배치되지 않아 폭이 0이면 다음 프레임에 다시 그린다(폭 0으로 그리면 1px 사진이 된다).
  const viewW = c.view.clientWidth;
  if (!viewW) {
    requestAnimationFrame(function () { paintCell(c); });
    return;
  }
  c.view.style.height = Math.round(viewW * CELL.h / CELL.w) + 'px';

  const d = dimsByLoc[c.locIndex];
  const a = adjustFor(c.locIndex);
  const r = cellRect(d.w, d.h, a);
  a.mode = r.mode;
  a.scale = r.scale;
  a.offsetX = r.offsetX;
  a.offsetY = r.offsetY;

  const f = viewW / CELL.w;
  c.fg.style.width = (r.w * f) + 'px';
  c.fg.style.height = (r.h * f) + 'px';
  c.fg.style.left = (r.left * f) + 'px';
  c.fg.style.top = (r.top * f) + 'px';
  c.bg.style.display = r.mode === 'contain' ? 'block' : 'none';
  c.coverBtn.setAttribute('aria-pressed', String(r.mode === 'cover'));
  c.containBtn.setAttribute('aria-pressed', String(r.mode === 'contain'));
  c.range.value = String(Math.round(r.scale * 100));
  setText(c.rangeValue, Math.round(r.scale * 100) + '%');
  c.view.setAttribute('data-mode', r.mode);
  c.view.setAttribute('data-scale', String(Math.round(r.scale * 100)));
}

// 끌기 — 터치(touchstart/move)와 마우스 둘 다 받는다.
function bindDrag(c) {
  let active = false;
  let lastX = 0;
  let lastY = 0;

  const begin = function (px, py) {
    active = true;
    lastX = px;
    lastY = py;
    c.view.classList.add('dragging');
  };
  const move = function (px, py) {
    if (!active) return;
    const f = (c.view.clientWidth || 1) / CELL.w;
    const a = adjustFor(c.locIndex);
    a.offsetX += (px - lastX) / f;   // 화면 픽셀 → 셀 좌표계로 되돌린다
    a.offsetY += (py - lastY) / f;
    lastX = px;
    lastY = py;
    paintCell(c);                    // cellRect가 여기서 범위를 잘라 준다
  };
  const end = function () {
    active = false;
    c.view.classList.remove('dragging');
  };

  c.view.addEventListener('mousedown', function (e) { e.preventDefault(); begin(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { if (active) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);

  c.view.addEventListener('touchstart', function (e) {
    if (!e.touches.length) return;
    e.preventDefault();
    begin(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  c.view.addEventListener('touchmove', function (e) {
    if (!active || !e.touches.length) return;
    e.preventDefault();             // 끌기 중 화면이 함께 밀리지 않게 한다
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  c.view.addEventListener('touchend', end);
  c.view.addEventListener('touchcancel', end);
}

function buildAdjust() {
  clear(adjustList);
  adjustCells = [];
  const order = selected.slice().sort(function (a, b) { return a - b; });
  // 먼저 펼쳐야 상자 폭이 잡힌다. 숨긴 채로 그리면 폭 0이라 사진이 1px로 그려진다.
  adjustCard.hidden = order.length !== NEED;

  order.forEach(function (locIndex, n) {
    const p = photos.filter(function (x) { return x.locIndex === locIndex; })[0];
    if (!p) return;
    const src = 'data:' + p.mime + ';base64,' + p.full;

    const box = el('div', 'adjust-cell');
    box.setAttribute('data-cell', String(n));
    box.setAttribute('data-loc', String(locIndex));
    box.appendChild(el('p', 'adjust-title', (n + 1) + '번 칸 — ' + (locIndex + 1) + '. ' + p.name));

    const view = el('div', 'adjust-view');
    view.id = 'adjust-view-' + n;
    const bg = document.createElement('img');
    bg.className = 'adjust-bg';
    bg.src = src;
    bg.alt = '';
    const fg = document.createElement('img');
    fg.className = 'adjust-fg';
    fg.src = src;
    fg.alt = p.name + ' 인증사진';
    view.appendChild(bg);
    view.appendChild(fg);
    box.appendChild(view);

    const controls = el('div', 'adjust-controls');
    const modeRow = el('div', 'button-row');
    const coverBtn = el('button', 'secondary', '잘라 채우기');
    coverBtn.type = 'button';
    coverBtn.id = 'mode-cover-' + n;
    const containBtn = el('button', 'secondary', '전체 담기');
    containBtn.type = 'button';
    containBtn.id = 'mode-contain-' + n;
    modeRow.appendChild(coverBtn);
    modeRow.appendChild(containBtn);
    controls.appendChild(modeRow);

    const scaleRow = el('div', 'adjust-scale');
    const label = el('label', '', '배율');
    label.setAttribute('for', 'scale-' + n);
    const range = document.createElement('input');
    range.type = 'range';
    range.id = 'scale-' + n;
    range.min = String(Math.round(ADJUST.minScale * 100));
    range.max = String(Math.round(ADJUST.maxScale * 100));
    range.step = String(Math.round(ADJUST.scaleStep * 100));
    const rangeValue = el('span', 'adjust-scale-value', '100%');
    rangeValue.id = 'scale-value-' + n;
    scaleRow.appendChild(label);
    scaleRow.appendChild(range);
    scaleRow.appendChild(rangeValue);
    controls.appendChild(scaleRow);

    const resetBtn = el('button', 'secondary', '가운데로 초기화');
    resetBtn.type = 'button';
    resetBtn.id = 'reset-' + n;
    controls.appendChild(resetBtn);
    box.appendChild(controls);
    adjustList.appendChild(box);

    const c = {
      n: n, locIndex: locIndex, view: view, fg: fg, bg: bg,
      coverBtn: coverBtn, containBtn: containBtn, range: range,
      rangeValue: rangeValue, resetBtn: resetBtn
    };
    adjustCells.push(c);

    coverBtn.addEventListener('click', function () { adjustFor(locIndex).mode = 'cover'; paintCell(c); });
    containBtn.addEventListener('click', function () { adjustFor(locIndex).mode = 'contain'; paintCell(c); });
    range.addEventListener('input', function () {
      adjustFor(locIndex).scale = Number(range.value) / 100;
      paintCell(c);
    });
    // 가운데로 초기화 — 이동·배율을 되돌리고 모드도 자동 기본값으로 돌아간다(확정 24-⑴·⑶).
    resetBtn.addEventListener('click', function () {
      const d = dimsByLoc[locIndex];
      adjustByLoc[locIndex] = newAdjust(d.w, d.h);
      paintCell(c);
    });
    bindDrag(c);
  });

  // 4칸이 모두 붙어 배치가 끝난 뒤에 한 번에 그린다.
  adjustCells.forEach(function (c) { paintCell(c); });
}

// 상자 폭이 바뀌면 축척이 달라지므로 다시 그린다.
window.addEventListener('resize', function () {
  adjustCells.forEach(function (c) { paintCell(c); });
});

// 5장째 선택은 차단한다. 이미 고른 것을 눌러 해제할 수는 있다.
function toggle(locIndex) {
  const at = selected.indexOf(locIndex);
  if (at >= 0) {
    selected.splice(at, 1);
    showError(composeError, '');
  } else if (selected.length >= NEED) {
    showError(composeError, '4장까지만 고를 수 있습니다. 바꾸려면 고른 사진을 한 번 더 누르세요');
    return;
  } else {
    selected.push(locIndex);
    showError(composeError, '');
  }
  renderPicks();
}

async function make() {
  showError(composeError, '');
  setText(saveResult, '');
  makeBtn.disabled = true;
  try {
    // 셀 배치는 코스(장소) 순서 오름차순이다(확정 16).
    const chosen = selected.slice().sort(function (a, b) { return a - b; })
      .map(function (i) { return photos.filter(function (p) { return p.locIndex === i; })[0]; });
    // 셀 순서와 조정값 순서가 같은 배열이다(둘 다 locIndex 오름차순).
    const adjusts = chosen.map(function (p) { return adjustFor(p.locIndex); });
    const out = await composeFourcut(chosen, frameId, frameTexts, adjusts);

    if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
    lastResult = out;
    lastObjectUrl = URL.createObjectURL(out.blob);

    preview.src = out.dataUrl;
    setText(resultSize, out.width + ' × ' + out.height + ' JPEG · ' + Math.round(out.blob.size / 1024) + ' KB');
    resultCard.hidden = false;
  } catch (err) {
    // 실패해도 마지막으로 성공한 미리보기·Blob은 그대로 둔다.
    showError(composeError, err && err.message ? err.message : '네컷 이미지를 만들지 못했습니다');
  } finally {
    makeBtn.disabled = selected.length !== NEED;
  }
}

makeBtn.addEventListener('click', make);
document.getElementById('remake-btn').addEventListener('click', make);

// ── 저장 3버튼 — 각각 독립. 하나가 실패해도 나머지는 그대로 쓸 수 있다. ──────
document.getElementById('save-share').addEventListener('click', async function () {
  if (!lastResult) return;
  try {
    const file = new File([lastResult.blob], fileNameFor(session.groupNo), { type: OUTPUT.mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '인생네컷' });
      setText(saveResult, '공유 창을 열었습니다.');
    } else {
      setText(saveResult, '이 브라우저는 공유 저장을 지원하지 않습니다. 「파일로 내려받기」를 쓰세요.');
    }
  } catch (e) {
    setText(saveResult, '공유로 저장하지 못했습니다. 「파일로 내려받기」나 「새 탭에서 열기」를 쓰세요.');
  }
});

document.getElementById('save-download').addEventListener('click', function () {
  if (!lastResult) return;
  try {
    const a = document.createElement('a');
    a.href = lastObjectUrl;
    a.download = fileNameFor(session.groupNo);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setText(saveResult, '내려받기를 시작했습니다.');
  } catch (e) {
    setText(saveResult, '내려받지 못했습니다. 「새 탭에서 열기」로 길게 눌러 저장하세요.');
  }
});

document.getElementById('save-newtab').addEventListener('click', function () {
  if (!lastResult) return;
  const w = window.open(lastObjectUrl, '_blank');
  setText(saveResult, w
    ? '새 탭에서 사진을 길게 눌러 저장하세요.'
    : '새 탭이 막혔습니다. 「파일로 내려받기」를 쓰세요.');
});

// ── 시작 ──────────────────────────────────────────────────────────────────
(async function start() {
  try {
    if (!db.session) {
      db.session = {
        classId: session.classId, gid: session.gid,
        groupNo: session.groupNo, courseRev: session.courseRev
      };
    }
    await db.ensureReady();
    frameTexts = await db.getFrameTexts();
    photos = await db.listMyPhotos();     // 이미 locIndex 오름차순이다
    // 실픽셀을 먼저 읽어 둔다 — 셀보다 작은 사진의 자동 「전체 담기」 판정에 쓴다(확정 24-⑶).
    for (const p of photos) {
      dimsByLoc[p.locIndex] = await loadDims(p);
    }
    renderFrames();
    renderPicks();
    if (photos.length < NEED) {
      showError(notEnough, '장소 ' + NEED + '곳을 마치면 만들 수 있습니다. 지금 ' + photos.length + '곳.');
      makeBtn.disabled = true;
    }
  } catch (e) {
    showError(composeError, e && e.message ? e.message : '사진 목록을 불러오지 못했습니다');
  }
})();
</script>
</body>
</html>
