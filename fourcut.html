<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인생네컷 — 단국대 현장체험학습</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 이 화면 전용 규칙만 둔다(공용 규칙은 css/style.css). v3.2 확정 24 셀 조정 UI. */
  .adjust-cell { margin: 0 0 18px; }
  .adjust-cell:last-child { margin-bottom: 0; }
  .adjust-title { margin: 0 0 6px; font-weight: 700; font-size: 0.95rem; }

  /* 셀 미리보기 상자. 높이(= 폭 × 480/640)는 스크립트가 직접 넣는다.
     percent padding은 부모 폭 기준이라 max-width가 걸리면 비율이 어긋나고,
     aspect-ratio는 구형 iOS Safari에서 못 쓴다. */
  .adjust-view {
    position: relative;
    width: 100%;
    max-width: 320px;
    overflow: hidden;
    border-radius: 8px;
    background: #000;
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(55, 44, 32, 0.18);
    touch-action: none;          /* 끌기 중 페이지가 함께 스크롤되지 않게 한다 */
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
  }
  .adjust-view.dragging { cursor: grabbing; }
  .adjust-view > img {
    position: absolute;
    pointer-events: none;
    -webkit-user-drag: none;
    /* style.css의 `img { max-width: 100% }`가 확대·이동한 폭을 상자 폭으로 깎는다.
       여기서만 풀어 준다 — 잘라 채우기의 넘치는 부분이 잘려 검은 띠가 생기던 자리다. */
    max-width: none;
  }
  /* 「전체 담기」의 흐린 배경 미리보기. 산출물의 흐림은 fourcut.js가 캔버스로 그린다. */
  .adjust-bg {
    left: -8%; top: -8%; width: 116%; height: 116%;
    object-fit: cover;
    filter: blur(12px);
  }
  .adjust-controls { margin-top: 8px; }
  .adjust-controls .button-row { margin: 0 0 6px; }
  .adjust-controls button[aria-pressed="true"] { outline: 3px solid var(--accent); }
  .adjust-scale { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
  .adjust-scale input[type="range"] { flex: 1 1 auto; min-width: 0; }
  .adjust-scale .adjust-scale-value { flex: 0 0 auto; min-width: 3.5em; text-align: right; }

  /* 사후 설문 유도 배너 (설문 v1 §3 단계 2) */
  .survey-cta {
    margin: 14px 0 0;
    padding: 12px;
    border: 2px solid var(--accent);
    border-radius: 10px;
    background: var(--cur-bg);
    box-shadow: inset 0 0 0 3px rgba(179, 203, 199, 0.30);
  }
  .survey-cta-text { margin: 0 0 8px; font-size: 0.95rem; word-break: keep-all; }
</style>
</head>
<body class="page-fourcut">
<main id="app">
  <header class="app-header">
    <h1>인생네컷</h1>
    <p class="sub">장소 순서대로 놓인 사진 중 <strong>4장</strong>을 고르세요.</p>
  </header>

  <p id="not-enough" class="error" role="alert" hidden></p>
  <p id="compose-error" class="error" role="alert" hidden></p>

  <section class="card" id="pick-card">
    <p class="note" id="pick-count">고른 사진 0 / 4</p>
    <ul id="pick-list" class="pick-grid"></ul>
  </section>

  <!-- 셀별 자를 범위 조정 (확정 24). 4장을 고른 뒤에만 열린다.
       조정값은 이 기기의 이 화면에서만 쓰이고 서버에 저장하지 않는다(§5 금지 18). -->
  <section class="card" id="adjust-card" hidden>
    <h2 class="section-title">자를 범위 조정</h2>
    <p class="note">사진을 끌어 위치를 옮기고, 슬라이더로 크기를 바꿉니다.
      「잘라 채우기」는 칸에 꽉 채우고, 「전체 담기」는 사진 전체를 넣고 남는 자리를 흐린 배경으로 메웁니다.
      조정한 값은 이 기기에만 남고 저장되지 않습니다.</p>
    <div id="adjust-list"></div>
  </section>

  <section class="card">
    <h2 class="section-title">프레임</h2>
    <div id="frame-row" class="frame-row"></div>
    <button id="make-btn" type="button" disabled>네컷 만들기</button>
  </section>

  <section class="card" id="result-card" hidden>
    <h2 class="section-title">완성</h2>
    <img id="fourcut-preview" alt="완성된 네컷 미리보기">
    <p class="note" id="result-size"></p>
    <div class="button-row">
      <button id="save-share" type="button">공유로 저장</button>
      <button id="save-download" type="button">파일로 내려받기</button>
      <button id="save-newtab" type="button">새 탭에서 열기</button>
    </div>
    <p id="save-result" class="note" role="status"></p>
    <button id="remake-btn" type="button" class="secondary">다시 만들기</button>
    <!-- 사후 설문 유도 배너 (설문 v1 §3 단계 2). 네컷을 만든 직후가 설문 진입률이 가장 높다.
         이 화면에는 배너만 추가하고 fourcut.js는 건드리지 않는다(§5 금지 6). -->
    <div class="survey-cta">
      <p class="survey-cta-text">네컷을 만들었나요? 사후 설문도 작성해 주세요.</p>
      <a id="survey-cta-link" class="link-button" href="survey.html">사후 설문 작성하기</a>
    </div>
  </section>

  <!-- ── 오후 과제 「모둠 여행 앨범」 (설계지시안_여행앨범 §3-0 ⑺ · §3-A' 단계 C3) ──
       사용자 원문 「인생네컷 제작 테마 아래쪽에 UI를 추가」 그대로 이 화면 하단에 둔다.
       위의 네컷 섹션·id·문면은 한 글자도 건드리지 않는다.
       **상시 열림** — 미션 진행 수·네컷 완성 여부와 무관하게 항상 보인다(§1-1 #6·#11).
       그래서 hidden으로 시작하지 않는다. 모둠 미배정 학생은 이 화면에 오기 전에
       requireLogin({needsGroup:true})이 mission.html로 되돌린다.
       화면을 세우는 코드는 아래의 **별도 모듈 블록**이다 — 오전 초기화 IIFE 뒤에 붙이지
       않는다(P-검토 B-4 · X-1). -->
  <section class="card" id="album-card">
    <h2 class="section-title" id="album-title"></h2>
    <p id="album-error" class="error" role="alert" hidden></p>
    <!-- 앨범 대기 수는 **앨범 섹션 안에서만** 표시한다. 미션 화면의 미전송 배지는
         앨범을 세지 않는다(§3-0 ⑷-c #3). -->
    <p id="album-pending" class="note offline-note" role="status" hidden></p>
    <ul id="album-grid" class="album-grid"></ul>
    <button id="album-make" type="button"></button>
    <img id="album-preview" alt="완성된 앨범 미리보기" hidden>
    <p class="note" id="album-size"></p>
    <!-- 저장·공유 3경로 — 네컷 결과 카드와 같은 패턴·같은 문면이다. 셋은 서로 독립이라
         하나가 실패해도 나머지를 그대로 쓸 수 있다. -->
    <div class="button-row" id="album-save-row" hidden>
      <button id="album-share" type="button">공유로 저장</button>
      <button id="album-download" type="button">파일로 내려받기</button>
      <button id="album-newtab" type="button">새 탭에서 열기</button>
    </div>
    <p id="album-save-result" class="note" role="status"></p>
  </section>

  <section class="card">
    <a class="link-button" href="mission.html">미션 화면으로</a>
  </section>
</main>

<script type="module">
import { db } from './js/db.js';
import {
  composeFourcut, fileNameFor, OUTPUT,
  CELL, ADJUST, cellRect, newAdjust
} from './js/fourcut.js';
import {
  FRAMES, DEFAULT_FRAME_TEXTS, frameById, frameLayoutOf, cellBoxOf
} from './frames/frames.js';
import {
  requireLogin, setText, el, clear, registerServiceWorker, statusText
} from './js/common.js';

// 네컷은 모둠 사진이 재료다 — 미배정 학생에게는 만들 것이 없다. index로 튕기면
// 로그인은 멀쩡한데 로그인 화면이 떠 혼란스러우므로 mission으로 보내고, 거기 안내가 뜬다
// (§3-0 ⑵-b · 재검 N-4).
const session = requireLogin({ needsGroup: true });
const list = document.getElementById('pick-list');
const countEl = document.getElementById('pick-count');
const notEnough = document.getElementById('not-enough');
const composeError = document.getElementById('compose-error');
const makeBtn = document.getElementById('make-btn');
const resultCard = document.getElementById('result-card');
const preview = document.getElementById('fourcut-preview');
const resultSize = document.getElementById('result-size');
const saveResult = document.getElementById('save-result');
const frameRow = document.getElementById('frame-row');
const adjustCard = document.getElementById('adjust-card');
const adjustList = document.getElementById('adjust-list');

registerServiceWorker();

const NEED = 4;
let photos = [];
let selected = [];          // 선택 순서 보존. 합성 직전 locIndex 오름차순으로 정렬한다.
const dimsByLoc = {};       // locIndex → {w, h} 실픽셀. 자동 모드 판정과 미리보기에 쓴다.
const adjustByLoc = {};     // locIndex → 조정값. 선택을 껐다 켜도 유지된다(서버 저장 없음).
let adjustCells = [];       // 지금 그려진 조정 칸 4개의 DOM·상태
let frameId = FRAMES[0].id;
let frameTexts = DEFAULT_FRAME_TEXTS;
// 프레임별 설정(좌표판·문구 숨김)과 업로드된 이미지. 교사가 관리 화면에서 정한 것이다(확정 27).
let frameMeta = {};        // frameId → {layoutId, hideTexts, ...}
const assetCache = {};     // frameId → {background?, overlay?} 이미지 본문. 한 번만 읽는다.

// 지금 고른 프레임이 실제로 쓸 것들. 화면(미리보기 상자)과 합성이 같은 값을 본다(확정 29-⑸).
function frameOptionsFor(id) {
  const e = frameMeta[id] || {};
  return { layoutId: e.layoutId || null, hideTexts: e.hideTexts === true };
}
function currentFrame() { return frameById(frameId); }
function currentBox(n) { return cellBoxOf(currentFrame(), frameOptionsFor(frameId), n); }

// 이미지 본문은 고른 프레임의 것만, 한 번만 읽는다. 못 읽으면 색 프레임으로 계속 간다
// (오프라인 첫 진입 — 네컷 만들기 자체를 막지 않는다).
async function frameAssetsFor(id) {
  if (assetCache[id]) return assetCache[id];
  let got = {};
  try {
    got = (await db.getFrameAssetImages(id)) || {};
  } catch (e) {
    got = {};
  }
  assetCache[id] = got;
  return got;
}
let lastResult = null;      // 마지막으로 성공한 {blob, dataUrl} — 실패해도 버리지 않는다
let lastObjectUrl = null;

function showError(node, text) {
  setText(node, text);
  node.hidden = !text;
}

function renderFrames() {
  clear(frameRow);
  FRAMES.forEach(function (f) {
    const b = el('button', 'secondary', f.name);
    b.type = 'button';
    b.id = 'frame-' + f.id;
    b.setAttribute('aria-pressed', String(f.id === frameId));
    b.addEventListener('click', function () {
      frameId = f.id;
      renderFrames();
      // 프레임마다 칸 비율이 다를 수 있다(확정 29). 미리보기 상자를 새 비율로 다시 그린다.
      adjustCells.forEach(function (c) { paintCell(c); });
      frameAssetsFor(f.id);   // 미리 읽어 둔다(합성 때 기다리지 않게)
    });
    frameRow.appendChild(b);
  });
}

function renderPicks() {
  clear(list);
  photos.forEach(function (p) {
    const item = el('li', 'pick-item');
    item.setAttribute('data-loc', String(p.locIndex));
    const isSel = selected.indexOf(p.locIndex) >= 0;
    if (isSel) item.classList.add('selected');
    const full = selected.length >= NEED && !isSel;
    if (full) item.classList.add('disabled');
    item.setAttribute('aria-pressed', String(isSel));

    const img = document.createElement('img');
    img.src = 'data:' + p.mime + ';base64,' + p.full;
    img.alt = p.name + ' 인증사진';
    item.appendChild(img);

    const label = el('div', 'pick-label');
    const order = el('span', 'pick-order', isSel ? String(selected.indexOf(p.locIndex) + 1) : '·');
    label.appendChild(order);
    label.appendChild(document.createTextNode(' ' + (p.locIndex + 1) + '. ' + p.name));
    item.appendChild(label);

    if (p.status !== 'synced') {
      item.appendChild(el('div', 'pick-label', statusText(p.status)));
    }

    item.addEventListener('click', function () { toggle(p.locIndex); });
    list.appendChild(item);
  });

  setText(countEl, '고른 사진 ' + selected.length + ' / ' + NEED);
  makeBtn.disabled = selected.length !== NEED;

  // 4장이 모이면 셀별 조정 칸을 연다(확정 24-⑴).
  if (selected.length === NEED) {
    buildAdjust();
  } else {
    adjustCells = [];
    clear(adjustList);
    adjustCard.hidden = true;
  }
}

// ── 셀별 자를 범위 조정 (확정 24) ─────────────────────────────────────────

// 사진의 실픽셀을 읽는다. 그 **칸**보다 작은지가 자동 모드 판정의 기준이다(확정 24-⑶).
// 칸 크기는 프레임의 좌표판에서 온다 — 프레임마다 다를 수 있다(확정 29).
function loadDims(p) {
  return new Promise(function (resolve) {
    const img = new Image();
    img.onload = function () { resolve({ w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = function () { resolve({ w: currentBox(0).w, h: currentBox(0).h }); };
    img.src = 'data:' + p.mime + ';base64,' + p.full;
  });
}

function adjustFor(locIndex, box) {
  const fallback = box || currentBox(0);
  const d = dimsByLoc[locIndex] || { w: fallback.w, h: fallback.h };
  if (!adjustByLoc[locIndex]) adjustByLoc[locIndex] = newAdjust(d.w, d.h, fallback);
  return adjustByLoc[locIndex];
}

// 미리보기 상자와 합성 캔버스가 같은 cellRect()를 쓴다.
// 축척 = 상자 폭 / 그 칸의 폭. 칸 크기는 프레임의 좌표판에서 온다(확정 29-⑸).
function paintCell(c) {
  // 아직 배치되지 않아 폭이 0이면 다음 프레임에 다시 그린다(폭 0으로 그리면 1px 사진이 된다).
  const viewW = c.view.clientWidth;
  if (!viewW) {
    requestAnimationFrame(function () { paintCell(c); });
    return;
  }
  const box = currentBox(c.n);
  c.view.style.height = Math.round(viewW * box.h / box.w) + 'px';

  const d = dimsByLoc[c.locIndex];
  const a = adjustFor(c.locIndex, box);
  const r = cellRect(d.w, d.h, a, box);
  a.mode = r.mode;
  a.scale = r.scale;
  a.offsetX = r.offsetX;
  a.offsetY = r.offsetY;

  const f = viewW / box.w;
  c.fg.style.width = (r.w * f) + 'px';
  c.fg.style.height = (r.h * f) + 'px';
  c.fg.style.left = (r.left * f) + 'px';
  c.fg.style.top = (r.top * f) + 'px';
  c.bg.style.display = r.mode === 'contain' ? 'block' : 'none';
  c.coverBtn.setAttribute('aria-pressed', String(r.mode === 'cover'));
  c.containBtn.setAttribute('aria-pressed', String(r.mode === 'contain'));
  c.range.value = String(Math.round(r.scale * 100));
  setText(c.rangeValue, Math.round(r.scale * 100) + '%');
  c.view.setAttribute('data-mode', r.mode);
  c.view.setAttribute('data-scale', String(Math.round(r.scale * 100)));
}

// 끌기 — 터치(touchstart/move)와 마우스 둘 다 받는다.
function bindDrag(c) {
  let active = false;
  let lastX = 0;
  let lastY = 0;

  const begin = function (px, py) {
    active = true;
    lastX = px;
    lastY = py;
    c.view.classList.add('dragging');
  };
  const move = function (px, py) {
    if (!active) return;
    const f = (c.view.clientWidth || 1) / currentBox(c.n).w;
    const a = adjustFor(c.locIndex, currentBox(c.n));
    a.offsetX += (px - lastX) / f;   // 화면 픽셀 → 셀 좌표계로 되돌린다
    a.offsetY += (py - lastY) / f;
    lastX = px;
    lastY = py;
    paintCell(c);                    // cellRect가 여기서 범위를 잘라 준다
  };
  const end = function () {
    active = false;
    c.view.classList.remove('dragging');
  };

  c.view.addEventListener('mousedown', function (e) { e.preventDefault(); begin(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { if (active) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', end);

  c.view.addEventListener('touchstart', function (e) {
    if (!e.touches.length) return;
    e.preventDefault();
    begin(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  c.view.addEventListener('touchmove', function (e) {
    if (!active || !e.touches.length) return;
    e.preventDefault();             // 끌기 중 화면이 함께 밀리지 않게 한다
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  c.view.addEventListener('touchend', end);
  c.view.addEventListener('touchcancel', end);
}

function buildAdjust() {
  clear(adjustList);
  adjustCells = [];
  const order = selected.slice().sort(function (a, b) { return a - b; });
  // 먼저 펼쳐야 상자 폭이 잡힌다. 숨긴 채로 그리면 폭 0이라 사진이 1px로 그려진다.
  adjustCard.hidden = order.length !== NEED;

  order.forEach(function (locIndex, n) {
    const p = photos.filter(function (x) { return x.locIndex === locIndex; })[0];
    if (!p) return;
    const src = 'data:' + p.mime + ';base64,' + p.full;

    const box = el('div', 'adjust-cell');
    box.setAttribute('data-cell', String(n));
    box.setAttribute('data-loc', String(locIndex));
    box.appendChild(el('p', 'adjust-title', (n + 1) + '번 칸 — ' + (locIndex + 1) + '. ' + p.name));

    const view = el('div', 'adjust-view');
    view.id = 'adjust-view-' + n;
    const bg = document.createElement('img');
    bg.className = 'adjust-bg';
    bg.src = src;
    bg.alt = '';
    const fg = document.createElement('img');
    fg.className = 'adjust-fg';
    fg.src = src;
    fg.alt = p.name + ' 인증사진';
    view.appendChild(bg);
    view.appendChild(fg);
    box.appendChild(view);

    const controls = el('div', 'adjust-controls');
    const modeRow = el('div', 'button-row');
    const coverBtn = el('button', 'secondary', '잘라 채우기');
    coverBtn.type = 'button';
    coverBtn.id = 'mode-cover-' + n;
    const containBtn = el('button', 'secondary', '전체 담기');
    containBtn.type = 'button';
    containBtn.id = 'mode-contain-' + n;
    modeRow.appendChild(coverBtn);
    modeRow.appendChild(containBtn);
    controls.appendChild(modeRow);

    const scaleRow = el('div', 'adjust-scale');
    const label = el('label', '', '배율');
    label.setAttribute('for', 'scale-' + n);
    const range = document.createElement('input');
    range.type = 'range';
    range.id = 'scale-' + n;
    range.min = String(Math.round(ADJUST.minScale * 100));
    range.max = String(Math.round(ADJUST.maxScale * 100));
    range.step = String(Math.round(ADJUST.scaleStep * 100));
    const rangeValue = el('span', 'adjust-scale-value', '100%');
    rangeValue.id = 'scale-value-' + n;
    scaleRow.appendChild(label);
    scaleRow.appendChild(range);
    scaleRow.appendChild(rangeValue);
    controls.appendChild(scaleRow);

    const resetBtn = el('button', 'secondary', '가운데로 초기화');
    resetBtn.type = 'button';
    resetBtn.id = 'reset-' + n;
    controls.appendChild(resetBtn);
    box.appendChild(controls);
    adjustList.appendChild(box);

    const c = {
      n: n, locIndex: locIndex, view: view, fg: fg, bg: bg,
      coverBtn: coverBtn, containBtn: containBtn, range: range,
      rangeValue: rangeValue, resetBtn: resetBtn
    };
    adjustCells.push(c);

    coverBtn.addEventListener('click', function () { adjustFor(locIndex).mode = 'cover'; paintCell(c); });
    containBtn.addEventListener('click', function () { adjustFor(locIndex).mode = 'contain'; paintCell(c); });
    range.addEventListener('input', function () {
      adjustFor(locIndex).scale = Number(range.value) / 100;
      paintCell(c);
    });
    // 가운데로 초기화 — 이동·배율을 되돌리고 모드도 자동 기본값으로 돌아간다(확정 24-⑴·⑶).
    resetBtn.addEventListener('click', function () {
      const d = dimsByLoc[locIndex];
      adjustByLoc[locIndex] = newAdjust(d.w, d.h, currentBox(c.n));
      paintCell(c);
    });
    bindDrag(c);
  });

  // 4칸이 모두 붙어 배치가 끝난 뒤에 한 번에 그린다.
  adjustCells.forEach(function (c) { paintCell(c); });
}

// 상자 폭이 바뀌면 축척이 달라지므로 다시 그린다.
window.addEventListener('resize', function () {
  adjustCells.forEach(function (c) { paintCell(c); });
});

// 5장째 선택은 차단한다. 이미 고른 것을 눌러 해제할 수는 있다.
function toggle(locIndex) {
  const at = selected.indexOf(locIndex);
  if (at >= 0) {
    selected.splice(at, 1);
    showError(composeError, '');
  } else if (selected.length >= NEED) {
    showError(composeError, '4장까지만 고를 수 있습니다. 바꾸려면 고른 사진을 한 번 더 누르세요');
    return;
  } else {
    selected.push(locIndex);
    showError(composeError, '');
  }
  renderPicks();
}

async function make() {
  showError(composeError, '');
  setText(saveResult, '');
  makeBtn.disabled = true;
  try {
    // 셀 배치는 코스(장소) 순서 오름차순이다(확정 16).
    const chosen = selected.slice().sort(function (a, b) { return a - b; })
      .map(function (i) { return photos.filter(function (p) { return p.locIndex === i; })[0]; });
    // 셀 순서와 조정값 순서가 같은 배열이다(둘 다 locIndex 오름차순).
    const adjusts = chosen.map(function (p, n) { return adjustFor(p.locIndex, currentBox(n)); });
    // 교사가 올린 배경·오버레이와 좌표판·문구 숨김을 함께 넘긴다(확정 27·28·29).
    // 자산을 못 읽었으면 빈 객체가 가고, 합성은 색 프레임으로 정상 진행한다.
    const opts = frameOptionsFor(frameId);
    opts.assets = await frameAssetsFor(frameId);
    const out = await composeFourcut(chosen, frameId, frameTexts, adjusts, opts);

    if (lastObjectUrl) URL.revokeObjectURL(lastObjectUrl);
    lastResult = out;
    lastObjectUrl = URL.createObjectURL(out.blob);

    preview.src = out.dataUrl;
    setText(resultSize, out.width + ' × ' + out.height + ' JPEG · ' + Math.round(out.blob.size / 1024) + ' KB');
    resultCard.hidden = false;
  } catch (err) {
    // 실패해도 마지막으로 성공한 미리보기·Blob은 그대로 둔다.
    showError(composeError, err && err.message ? err.message : '네컷 이미지를 만들지 못했습니다');
  } finally {
    makeBtn.disabled = selected.length !== NEED;
  }
}

makeBtn.addEventListener('click', make);
document.getElementById('remake-btn').addEventListener('click', make);

// ── 저장 3버튼 — 각각 독립. 하나가 실패해도 나머지는 그대로 쓸 수 있다. ──────
document.getElementById('save-share').addEventListener('click', async function () {
  if (!lastResult) return;
  try {
    const file = new File([lastResult.blob], fileNameFor(session.groupNo), { type: OUTPUT.mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '인생네컷' });
      setText(saveResult, '공유 창을 열었습니다.');
    } else {
      setText(saveResult, '이 브라우저는 공유 저장을 지원하지 않습니다. 「파일로 내려받기」를 쓰세요.');
    }
  } catch (e) {
    setText(saveResult, '공유로 저장하지 못했습니다. 「파일로 내려받기」나 「새 탭에서 열기」를 쓰세요.');
  }
});

document.getElementById('save-download').addEventListener('click', function () {
  if (!lastResult) return;
  try {
    const a = document.createElement('a');
    a.href = lastObjectUrl;
    a.download = fileNameFor(session.groupNo);
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setText(saveResult, '내려받기를 시작했습니다.');
  } catch (e) {
    setText(saveResult, '내려받지 못했습니다. 「새 탭에서 열기」로 길게 눌러 저장하세요.');
  }
});

document.getElementById('save-newtab').addEventListener('click', function () {
  if (!lastResult) return;
  const w = window.open(lastObjectUrl, '_blank');
  setText(saveResult, w
    ? '새 탭에서 사진을 길게 눌러 저장하세요.'
    : '새 탭이 막혔습니다. 「파일로 내려받기」를 쓰세요.');
});

// ── 시작 ──────────────────────────────────────────────────────────────────
(async function start() {
  try {
    if (!db.session) {
      db.session = {
        classId: session.classId, sid: session.sid, name: session.name,
        gid: session.gid, groupNo: session.groupNo,
        email: session.email, courseRev: session.courseRev
      };
    }
    await db.ensureReady();
    frameTexts = await db.getFrameTexts();
    // 프레임별 설정을 먼저 읽는다 — 칸 좌표가 여기서 정해지므로 사진 실픽셀 판정보다 앞서야 한다.
    try {
      frameMeta = (await db.getFrameAssetMeta()) || {};
    } catch (e) {
      frameMeta = {};   // 설정을 못 읽어도 기본 좌표판으로 계속 간다
    }
    frameAssetsFor(frameId);   // 기본 프레임 이미지를 미리 읽어 둔다(기다리지 않는다)
    photos = await db.listMyPhotos();     // 이미 locIndex 오름차순이다
    // 실픽셀을 먼저 읽어 둔다 — 셀보다 작은 사진의 자동 「전체 담기」 판정에 쓴다(확정 24-⑶).
    for (const p of photos) {
      dimsByLoc[p.locIndex] = await loadDims(p);
    }
    renderFrames();
    renderPicks();
    if (photos.length < NEED) {
      showError(notEnough, '장소 ' + NEED + '곳을 마치면 만들 수 있습니다. 지금 ' + photos.length + '곳.');
      makeBtn.disabled = true;
    }
  } catch (e) {
    showError(composeError, e && e.message ? e.message : '사진 목록을 불러오지 못했습니다');
  }
})();
</script>

<!-- ── 오후 과제 「모둠 여행 앨범」 화면 (설계지시안_여행앨범 §3-A' 단계 C3) ───────
     ⚠ **위 네컷 모듈과 완전히 분리된 별도 모듈**이다(P-검토 B-4 · X-1 치명 방어).
        위 초기화 IIFE는 listMyPhotos() → 사진 4장 loadDims()를 순차로 await하고, 던지면
        거기서 끝난다. 앨범을 그 뒤에 이어 붙이면 **오전 기능의 실패·지연이 오후 과제를
        통째로 막는다**. 그래서 앨범은 오전 사진 로딩을 기다리지 않고, 자체 try/catch로
        자기 화면만 세운다. db·모듈은 같은 인스턴스를 공유한다(ES 모듈 캐시).
     문면·격자·캡션 규격은 album.js가 단일 원천이다 — 여기에 리터럴로 다시 적지 않는다
     (F-1 · §5 금지 4c). -->
<script type="module">
import { db, GROUP_CHANGED_TEXT } from './js/db.js';
import {
  ALBUM, albumSlotId, albumFileNameFor, composeAlbum, emptyAlbum
} from './js/album.js';
import { compressAlbumPhoto } from './js/compress.js';
import {
  loadSession, setText, el, clear, statusText, STATUS_TEXT, markBusy, markIdle
} from './js/common.js';

// §3-0 ⑼ ⑦ — 「다시 전송」은 미션 사진 카드와 **같은 문면**이며 새 어휘가 아니다.
// ALBUM.text에는 이 키가 없으므로(정본 표의 ⑦은 미션 문면을 가리킨다) 여기서 한 번만 둔다.
const ALBUM_RETRY_TEXT = '다시 전송';

const albumCard = document.getElementById('album-card');
const albumGrid = document.getElementById('album-grid');
const albumErrorEl = document.getElementById('album-error');
const albumPendingEl = document.getElementById('album-pending');
const albumMake = document.getElementById('album-make');
const albumPreview = document.getElementById('album-preview');
const albumSize = document.getElementById('album-size');
const albumSaveRow = document.getElementById('album-save-row');
const albumSaveResult = document.getElementById('album-save-result');

// 섹션 제목·내려받기 버튼 문면은 정본에서 가져온다(§3-0 ⑼ ①③).
setText(document.getElementById('album-title'), ALBUM.text.sectionTitle);
setText(albumMake, ALBUM.text.download);

let albumRows = emptyAlbum();   // getAlbum()·onAlbum()이 주는 Array(16). 빈 칸은 null이다
let failedBySlot = {};          // slotId → 보관함 항목(사진이 여기에만 남은 칸이 있다)
let pendingBySlot = {};         // slotId → 대기 시각
const albumCells = [];          // 칸 DOM. **한 번만** 만들고 이후에는 다시 칠하기만 한다
const albumBusy = {};           // 업로드·재전송 중인 칸
let albumResult = null;         // 마지막으로 성공한 합성 {blob, width, height}
let albumObjectUrl = null;
let albumSession = null;

function showAlbumError(text) {
  setText(albumErrorEl, text);
  albumErrorEl.hidden = !text;
}

// 칸에 보일 사진. 서버 문서가 없어도 보관함에 남은 것이 있으면 그것을 보여 준다 —
// 「전송 오류 — 사진은 보관됨」이 화면에서도 사실이어야 한다(X-1).
function albumItemAt(n) {
  return albumRows[n] || failedBySlot[albumSlotId(n)] || null;
}

// 상태는 error > queued > synced 순서로 정한다.
// ⚠ **빈 칸은 상태가 아니다.** statusText()에 넣으면 미지정 폴백인 「잠금」이 떠
//    §0 「상시 열림」과 정면으로 모순된다(P-검토 B-6). 그래서 빈 문자열을 돌려준다.
function albumStatusAt(n) {
  const id = albumSlotId(n);
  if (failedBySlot[id]) return 'error';
  if (pendingBySlot[id]) return 'queued';
  if (albumRows[n]) return 'synced';
  return '';
}

function buildAlbumGrid() {
  clear(albumGrid);
  albumCells.length = 0;
  for (let n = 0; n < ALBUM.slots; n += 1) {
    const id = albumSlotId(n);
    const li = el('li', 'album-cell');
    li.id = 'album-cell-' + id;
    li.setAttribute('data-slot', id);

    // 업로드 input은 미션 카드와 **같은 마크업**이다(§3-0 ⑺): accept만 두고
    // capture 속성은 붙이지 않는다 — 붙이면 선택창을 건너뛰고 카메라가 바로 열려
    // 이미 찍어 둔 사진을 고를 길이 사라진다. .loc-file은 「지우지 않고 감추는」
    // 기존 자산이라 스크린리더·자동화가 계속 찾을 수 있다.
    const file = document.createElement('input');
    file.type = 'file';
    file.accept = 'image/*';
    file.id = 'album-file-' + id;
    file.className = 'loc-file';
    li.appendChild(file);

    // 사진 자리 전체가 파일 선택 라벨이다 — 칸을 누르면 파일 선택이 열린다.
    const shot = el('label', 'album-shot');
    shot.id = 'album-shot-' + id;
    shot.setAttribute('for', file.id);
    const img = document.createElement('img');
    img.className = 'album-img';
    img.id = 'album-img-' + id;
    img.alt = '';
    img.hidden = true;
    shot.appendChild(img);
    const empty = el('span', 'album-empty', ALBUM.text.emptyCell);   // §3-0 ⑼ ②
    empty.id = 'album-empty-' + id;
    shot.appendChild(empty);
    li.appendChild(shot);

    const badge = el('span', 'badge album-badge');
    badge.id = 'album-badge-' + id;
    badge.hidden = true;
    li.appendChild(badge);

    // 캡션 한 줄. 자수·placeholder는 album.js에서 **파생**한다 — 숫자를 직접 적지 않는다
    // (§1-1 #14 · §5 금지 4c). 사진이 없는 칸은 저장할 곳이 없으므로 잠가 둔다.
    const cap = document.createElement('input');
    cap.type = 'text';
    cap.className = 'album-caption';
    cap.id = 'album-caption-' + id;
    cap.maxLength = ALBUM.caption.maxChars;
    cap.placeholder = ALBUM.text.captionPlaceholder;                 // §3-0 ⑼ ⑤
    cap.setAttribute('aria-label', (n + 1) + ' · ' + ALBUM.text.captionPlaceholder);
    cap.disabled = true;
    li.appendChild(cap);

    const stage = el('p', 'note album-stage');
    stage.id = 'album-stage-' + id;
    li.appendChild(stage);

    // 전송 오류 칸에만 보인다. 이 버튼이 없으면 학생이 보관분을 되살릴 길이 없다.
    const retry = el('button', 'secondary album-retry', ALBUM_RETRY_TEXT);
    retry.type = 'button';
    retry.id = 'album-retry-' + id;
    retry.hidden = true;
    li.appendChild(retry);

    file.addEventListener('change', function () { onAlbumPick(n, file); });
    // 포커스가 떠날 때(값이 바뀐 경우) 저장한다 — change가 바로 그 사건이다.
    cap.addEventListener('change', function () { onAlbumCaption(n, cap); });
    retry.addEventListener('click', function () { onAlbumRetry(n); });

    albumGrid.appendChild(li);
    albumCells.push({
      n: n, id: id, li: li, file: file, img: img, empty: empty,
      badge: badge, cap: cap, stage: stage, retry: retry
    });
  }
}

function setAlbumStage(n, text) {
  const c = albumCells[n];
  if (c) setText(c.stage, text);
}

// 앨범 대기 수 — 이 섹션 안에서만 보인다(§3-0 ⑷-c #3). 상태 어휘는 STATUS_TEXT가 원천이다.
// 전송 오류 칸은 여기서 세지 않는다 — 그것은 자동 전송으로 풀리지 않고 칸의 「다시 전송」이 맡는다.
function paintAlbumPending() {
  const n = Object.keys(pendingBySlot).length;
  albumPendingEl.hidden = n === 0;
  setText(albumPendingEl, STATUS_TEXT.queued + ' ' + n + '칸 — 신호가 잡히면 자동 전송됩니다');
}

function paintAlbum() {
  albumCells.forEach(function (c) {
    const item = albumItemAt(c.n);
    const st = albumStatusAt(c.n);

    if (item && item.b64) {
      c.img.src = 'data:' + (item.mime || 'image/jpeg') + ';base64,' + item.b64;
      c.img.alt = (c.n + 1) + '번 칸' + (item.caption ? ' — ' + item.caption : '');
      c.img.hidden = false;
      c.empty.hidden = true;
      c.li.classList.add('is-filled');
    } else {
      c.img.removeAttribute('src');
      c.img.alt = '';
      c.img.hidden = true;
      c.empty.hidden = false;
      c.li.classList.remove('is-filled');
    }

    // 정상 synced는 사진 자체로 표시한다. 주의가 필요한 queued·error만 배지를 그린다.
    if (st) {
      setText(c.badge, statusText(st));
      if (st === 'queued' || st === 'error') {
        c.badge.className = 'badge album-badge badge-' + st;
        c.badge.hidden = false;
      } else {
        c.badge.className = 'badge album-badge';
        c.badge.hidden = true;
      }
    } else {
      setText(c.badge, '');
      c.badge.className = 'badge album-badge';
      c.badge.hidden = true;
    }

    c.cap.disabled = !item;
    // 지금 입력 중인 칸의 글자를 구독 갱신이 덮어쓰지 않게 한다.
    if (document.activeElement !== c.cap) c.cap.value = (item && item.caption) || '';
    c.retry.hidden = st !== 'error';
  });
  paintAlbumPending();
}

// 대기·보관 목록은 구독이 알려 주지 않는다. 첫 진입과 저장·재전송 직후, 그리고 스냅샷마다
// 직접 읽는다 — listPendingAlbum()은 **새로고침 후 대기 배지를 복원하는 유일한 경로**다.
async function refreshAlbumAux() {
  const rows = await Promise.all([db.listFailedAlbum(), db.listPendingAlbum()]);
  const failed = rows[0] || [];
  const pending = rows[1] || [];
  const nextFailed = {};
  failed.forEach(function (r) { if (r && r.slot) nextFailed[albumSlotId(r.slot)] = r; });
  const nextPending = {};
  pending.forEach(function (r) { if (r && r.slot) nextPending[albumSlotId(r.slot)] = r.at; });
  failedBySlot = nextFailed;
  pendingBySlot = nextPending;
}

async function onAlbumPick(n, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (albumBusy[n]) return;
  albumBusy[n] = true;
  markBusy();
  showAlbumError('');
  try {
    const out = await compressAlbumPhoto(file, function (t) { setAlbumStage(n, t); });
    setAlbumStage(n, '사진을 보내는 중');
    // caption 키를 **넘기지 않는다** — merge 저장이라 기존 캡션이 그대로 보존된다(db 계약).
    await db.saveAlbumSlot(n, { b64: out.b64, mime: out.mime, w: out.width, h: out.height });
    await refreshAlbumAux();
    // 결과 문구는 칸 배지가 이미 말한다. 여기서 또 쓰면 한 칸에 같은 말이 두 번 뜬다.
    setAlbumStage(n, '');
    paintAlbum();
  } catch (err) {
    setAlbumStage(n, '');
    showAlbumError(err && err.message ? err.message : '사진을 올리지 못했습니다');
  } finally {
    input.value = '';
    delete albumBusy[n];
    markIdle();
  }
}

async function onAlbumCaption(n, cap) {
  if (albumBusy[n]) return;
  albumBusy[n] = true;
  showAlbumError('');
  try {
    await db.saveAlbumCaption(n, cap.value);
  } catch (err) {
    showAlbumError(err && err.message ? err.message : '캡션을 저장하지 못했습니다');
  } finally {
    delete albumBusy[n];
  }
}

async function onAlbumRetry(n) {
  if (albumBusy[n]) return;
  albumBusy[n] = true;
  markBusy();
  showAlbumError('');
  try {
    setAlbumStage(n, '다시 보내는 중');
    await db.retryFailedAlbum(n);
    await refreshAlbumAux();
    setAlbumStage(n, '');
    paintAlbum();
  } catch (err) {
    setAlbumStage(n, '');
    showAlbumError(err && err.message ? err.message : '다시 보내지 못했습니다');
  } finally {
    delete albumBusy[n];
    markIdle();
  }
}

// ── 내려받기 ──────────────────────────────────────────────────────────────
// 화면에 보이는 것과 같은 배열을 넘긴다 — 보관분까지 포함해 「보는 것이 곧 받는 것」이다.
async function onAlbumMake() {
  showAlbumError('');
  setText(albumSaveResult, '');
  albumMake.disabled = true;
  try {
    const slots = [];
    for (let n = 0; n < ALBUM.slots; n += 1) slots.push(albumItemAt(n));
    const out = await composeAlbum(slots, {
      groupNo: albumSession ? albumSession.groupNo : null,
      date: new Date()
    });
    if (albumObjectUrl) URL.revokeObjectURL(albumObjectUrl);
    albumResult = out;
    albumObjectUrl = URL.createObjectURL(out.blob);
    albumPreview.src = albumObjectUrl;
    albumPreview.hidden = false;
    setText(albumSize, out.width + ' × ' + out.height + ' JPEG · ' + Math.round(out.blob.size / 1024) + ' KB');
    albumSaveRow.hidden = false;
  } catch (err) {
    // 마지막으로 성공한 미리보기·Blob은 그대로 둔다(네컷과 같은 판단).
    showAlbumError(err && err.message ? err.message : ALBUM.text.composeError);
  } finally {
    albumMake.disabled = false;
  }
}

albumMake.addEventListener('click', onAlbumMake);

function albumFileName() {
  return albumFileNameFor(albumSession ? albumSession.groupNo : 0);
}

document.getElementById('album-share').addEventListener('click', async function () {
  if (!albumResult) return;
  try {
    const f = new File([albumResult.blob], albumFileName(), { type: ALBUM.output.mime });
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      await navigator.share({ files: [f], title: ALBUM.text.sectionTitle });
      setText(albumSaveResult, '공유 창을 열었습니다.');
    } else {
      setText(albumSaveResult, '이 브라우저는 공유 저장을 지원하지 않습니다. 「파일로 내려받기」를 쓰세요.');
    }
  } catch (e) {
    setText(albumSaveResult, '공유로 저장하지 못했습니다. 「파일로 내려받기」나 「새 탭에서 열기」를 쓰세요.');
  }
});

document.getElementById('album-download').addEventListener('click', function () {
  if (!albumResult) return;
  try {
    const a = document.createElement('a');
    a.href = albumObjectUrl;
    a.download = albumFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setText(albumSaveResult, '내려받기를 시작했습니다.');
  } catch (e) {
    setText(albumSaveResult, '내려받지 못했습니다. 「새 탭에서 열기」로 길게 눌러 저장하세요.');
  }
});

document.getElementById('album-newtab').addEventListener('click', function () {
  if (!albumResult) return;
  const w = window.open(albumObjectUrl, '_blank');
  setText(albumSaveResult, w
    ? '새 탭에서 사진을 길게 눌러 저장하세요.'
    : '새 탭이 막혔습니다. 「파일로 내려받기」를 쓰세요.');
});

// ── 시작 ──────────────────────────────────────────────────────────────────
// requireLogin을 다시 부르지 않는다 — 위 모듈이 이미 판정했고, 여기서 또 부르면
// 같은 조건에서 location.replace가 두 번 일어난다. 세션만 읽어 스스로 분기한다.
(async function albumStart() {
  try {
    const s = loadSession();
    if (!s || !s.classId || !s.sid) return;   // 위 모듈이 index.html로 되돌리는 중이다
    if (!s.gid) { albumCard.hidden = true; return; }   // 모둠 미배정 — 앨범은 모둠 것이다
    albumSession = s;

    if (!db.session) {
      db.session = {
        classId: s.classId, sid: s.sid, name: s.name,
        gid: s.gid, groupNo: s.groupNo,
        email: s.email, courseRev: s.courseRev
      };
    }
    await db.ensureReady();

    buildAlbumGrid();
    paintAlbum();                 // 빈 격자를 먼저 세운다 — 읽기가 늦어도 칸은 보인다
    await refreshAlbumAux();
    albumRows = await db.getAlbum();
    paintAlbum();

    // ⚠ onError는 **필수**다(D-1 · P-검토 A-10). 붙이지 않으면 교사가 모둠 구성을 바꿔
    //    구독이 끊길 때 SDK가 uncaught로 던지고 화면이 얼어붙는다.
    db.onAlbum(function (rows) {
      albumRows = rows;
      paintAlbum();
      // 대기·보관은 스냅샷에 실려 오지 않는다. 함께 새로 읽되 거부를 여기서 끝낸다 —
      // await 없는 미처리 거부는 pageerror가 된다(과거 결함 자가 점검).
      refreshAlbumAux().then(paintAlbum).catch(function () { /* 격자는 이미 그렸다 */ });
    }, function (err) {
      showAlbumError(err && err.code === 'permission-denied'
        ? GROUP_CHANGED_TEXT
        : '앨범을 실시간으로 받지 못하고 있습니다. 화면을 새로고침하세요.');
    });
  } catch (e) {
    showAlbumError(e && e.message ? e.message : '앨범을 불러오지 못했습니다');
  }
})();
</script>
