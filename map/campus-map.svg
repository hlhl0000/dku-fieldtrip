<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">DANKOOK FIELD ROUTE</title>
  <desc id="map-desc">캠퍼스 입구에서 죽전역으로 내려가 보정동 카페거리와 용인포은아트홀로 갈라지는 동선 모식도. 둘 다 죽전역에서 갈린다.</desc>
  <defs>
    <pattern id="paper-grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M2 4h1M17 7h1M8 18h1M21 20h1M4 13h1M14 2h1" stroke="#cabb98" stroke-width="1" opacity=".45"/>
      <path d="M7 8h.8M19 15h.8M12 22h.8" stroke="#372c20" stroke-width=".8" opacity=".16"/>
    </pattern>
    <pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <path d="M1 0v11" stroke="#cabb98" stroke-width="2" opacity=".7"/>
    </pattern>
    <style>
      .ink{stroke:#372c20;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#372c20;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sepia{fill:#cabb98;stroke:#372c20;stroke-width:3;stroke-linejoin:round}.paper{fill:#f4ecd8;stroke:#372c20;stroke-width:3;stroke-linejoin:round}.teal{fill:#2b5a57;stroke:#372c20;stroke-width:3;stroke-linejoin:round}.gold{fill:#a8894e;stroke:#372c20;stroke-width:3;stroke-linejoin:round}.label{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Nanum Gothic',sans-serif;fill:#372c20;font-size:27px;font-weight:700;letter-spacing:-1.5px;paint-order:stroke;stroke:#f4ecd8;stroke-width:6px;stroke-linejoin:round}.small{font-family:Georgia,serif;fill:#372c20;font-size:16px;font-weight:700;letter-spacing:2px}.micro{font-family:Georgia,serif;fill:#372c20;font-size:12px;letter-spacing:1.4px}.route{fill:none;stroke:#2b5a57;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:2 24}.route-shadow{fill:none;stroke:#f4ecd8;stroke-width:22;stroke-linecap:round;stroke-linejoin:round}.water{fill:none;stroke:#2b5a57;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;opacity:.8}.building{fill:#f4ecd8;stroke:#372c20;stroke-width:3;stroke-linejoin:round}.window{fill:#cabb98;stroke:#372c20;stroke-width:2}.tree{fill:#a8894e;stroke:#372c20;stroke-width:2}.pin-ring{fill:#f4ecd8;stroke:#a8894e;stroke-width:5}.compass{fill:#372c20;font-family:Georgia,serif;font-size:14px;font-weight:700;letter-spacing:2px}
    </style>
  </defs>

  <!-- Craft-paper field and vintage border -->
  <rect width="900" height="1300" fill="#e6d9bf"/>
  <rect x="22" y="22" width="856" height="1256" rx="12" fill="#f4ecd8" stroke="#372c20" stroke-width="5"/>
  <rect x="34" y="34" width="832" height="1232" rx="8" fill="url(#paper-grain)" stroke="#cabb98" stroke-width="2"/>
  <path d="M55 112H845M55 1190H845" class="thin" opacity=".45"/>

  <!-- Header is deliberately English: every Korean label below is a LANDMARKS name. -->
  <text x="450" y="79" text-anchor="middle" class="small" font-size="25">DANKOOK FIELD ROUTE</text>
  <text x="450" y="104" text-anchor="middle" class="micro">GATE · STATION · TWO OUTDOOR ZONES</text>
  <path d="M238 123h424" class="thin" stroke-width="2"/>
  <circle cx="223" cy="123" r="5" fill="#a8894e"/><circle cx="677" cy="123" r="5" fill="#a8894e"/>

  <!-- top 22%: campus is a departure silhouette, intentionally not a second main map -->
  <path d="M66 165C135 138 205 152 276 171C346 142 422 151 486 172C576 137 673 151 835 174L835 310C724 290 610 307 510 298C390 311 236 286 66 312Z" fill="#cabb98" opacity=".5"/>
  <path d="M66 165C135 138 205 152 276 171C346 142 422 151 486 172C576 137 673 151 835 174" class="thin" stroke-width="4"/>
  <path d="M74 302C215 275 332 307 452 295C586 281 698 295 827 285" fill="none" stroke="#372c20" stroke-width="3" stroke-dasharray="3 9" opacity=".6"/>
  <g opacity=".78">
    <g transform="translate(330 236)"><circle cx="0" cy="-20" r="19" class="tree"/><circle cx="-15" cy="2" r="17" class="tree"/><circle cx="16" cy="2" r="17" class="tree"/><path d="M0 0v38" class="thin" stroke-width="5"/></g>
    <g transform="translate(790 230)"><circle cx="0" cy="-22" r="22" class="tree"/><circle cx="-17" cy="2" r="20" class="tree"/><circle cx="18" cy="2" r="20" class="tree"/><path d="M0 0v44" class="thin" stroke-width="5"/></g>
  </g>

  <!-- campus landmark: museum (필수 6곳 중 하나 — 설계지시안 v3.4 산출물 합의문) -->
  <g id="lm-museum" transform="translate(175 218)">
    <title>석주선기념박물관</title>
    <ellipse cx="0" cy="40" rx="76" ry="15" fill="#cabb98" opacity=".45"/>
    <path d="M-58 38V-14H58V38z" class="building"/>
    <path d="M-68-14L0-56 68-14z" class="gold"/>
    <path d="M-38 38V-4M-13 38V-4M13 38V-4M38 38V-4" class="thin" stroke-width="5"/>
    <path d="M-62 38H62" class="thin" stroke-width="4"/>
    <circle cx="0" cy="6" r="30" class="pin-ring"/>
  </g>
  <text x="175" y="296" text-anchor="middle" class="label" font-size="22">석주선기념박물관</text>

  <!-- campus landmark: central library (필수 6곳 중 하나) -->
  <g id="lm-library" transform="translate(660 218)">
    <title>퇴계기념중앙도서관</title>
    <ellipse cx="0" cy="40" rx="80" ry="15" fill="#cabb98" opacity=".45"/>
    <path d="M-62 38V-26H62V38z" class="building"/>
    <path d="M-70-26h140l-70-30z" class="teal"/>
    <path d="M-45 0h30v26h-30zM15 0h30v26h-30z" class="window"/>
    <path d="M-11 38V8h22v30z" class="sepia" stroke-width="3"/>
    <circle cx="0" cy="6" r="30" class="pin-ring"/>
  </g>
  <text x="660" y="296" text-anchor="middle" class="label" font-size="22">퇴계기념중앙도서관</text>

  <!-- main procession: descending road to station -->
  <path d="M450 300C419 363 483 409 450 492C421 565 445 600 450 650" class="route-shadow"/>
  <path d="M450 300C419 363 483 409 450 492C421 565 445 600 450 650" class="route"/>
  <path d="M396 350l-18 17 24 3M510 434l-18 17 24 3M397 535l-18 17 24 3" class="thin" stroke="#a8894e" stroke-width="4"/>
  <text x="515" y="415" class="micro">DOWNHILL WALK</text>
  <text x="515" y="435" class="micro">TO THE STATION</text>

  <!-- landmark: Gate -->
  <g id="lm-gate" transform="translate(450 286)">
    <title>정문 · 상징탑</title>
    <ellipse cx="0" cy="18" rx="86" ry="18" fill="#cabb98" opacity=".45"/>
    <path d="M-66 20V-34H66V20" class="building"/>
    <path d="M-76-34l76-44 76 44z" class="gold"/>
    <path d="M-37 20V-18M0 20V-18M37 20V-18" class="thin" stroke-width="5"/>
    <path d="M0-78V-127M-22-104h44" class="thin" stroke-width="6"/>
    <circle cx="0" cy="-132" r="10" class="teal"/>
    <circle cx="0" cy="-1" r="35" class="pin-ring"/>
  </g>
  <path d="M534 317l42 14" class="thin" stroke-width="3"/>
  <text x="586" y="340" text-anchor="start" class="label">정문 · 상징탑</text>

  <!-- station is the unmistakable fork -->
  <path d="M450 692C396 749 289 764 216 856C183 897 201 940 216 980" class="route-shadow"/>
  <path d="M450 692C396 749 289 764 216 856C183 897 201 940 216 980" class="route"/>
  <path d="M450 692C504 749 611 764 684 856C717 897 699 940 684 980" class="route-shadow"/>
  <path d="M450 692C504 749 611 764 684 856C717 897 699 940 684 980" class="route"/>
  <path d="M331 774l-22 11 19 13M569 774l22 11-19 13M250 880l-20 13 20 10M650 880l20 13-20 10" class="thin" stroke="#a8894e" stroke-width="4"/>

  <g id="lm-station" transform="translate(450 650)">
    <title>죽전역</title>
    <ellipse cx="0" cy="35" rx="106" ry="21" fill="#cabb98" opacity=".45"/>
    <path d="M-98 32V-51Q0-90 98-51V32z" class="building"/>
    <path d="M-108-50Q0-108 108-50" fill="none" stroke="#372c20" stroke-width="8"/>
    <path d="M-80-25H80" class="thin" stroke-width="4"/>
    <rect x="-70" y="-14" width="140" height="34" rx="4" class="teal"/>
    <path d="M-43-14v34M0-14v34M43-14v34" class="thin" stroke="#f4ecd8" stroke-width="3"/>
    <circle cx="0" cy="4" r="38" class="pin-ring"/>
  </g>
  <path d="M536 670l38 20" class="thin" stroke-width="3"/>
  <text x="584" y="708" text-anchor="start" class="label">죽전역</text>

  <!-- tancheon: scenic supporting line, left of the cafe branch -->
  <g id="lm-tancheon" transform="translate(90 923)">
    <title>탄천</title>
    <path d="M-20-109C33-78-36-39 16-8C68 23-4 65 37 116" class="water"/>
    <path d="M2-104C53-75-18-39 34-8C85 23 13 65 55 116" class="water" stroke-width="5" opacity=".45"/>
    <circle cx="34" cy="-36" r="26" class="pin-ring"/>
  </g>
  <text x="112" y="873" text-anchor="start" class="label">탄천</text>
  <path d="M124 889h56" class="thin" stroke="#2b5a57" stroke-width="3"/>

  <!-- lower left: cafe street miniature -->
  <g id="lm-bojeong" transform="translate(216 1040)">
    <title>보정동 카페거리</title>
    <ellipse cx="0" cy="62" rx="139" ry="27" fill="#cabb98" opacity=".5"/>
    <path d="M-129 56L-95-23H-47V56zM-44 56l26-102h58l29 102zM44 56l26-80h54l30 80z" class="building"/>
    <path d="M-136-21h96l-17-21h-61zM-24-44h77l-17-24h-43zM64-22h69l-18-20H81z" class="gold"/>
    <path d="M-119 5h67M-10-2h50M79 4h47" class="thin" stroke-width="3"/>
    <path d="M-99 57v-31M-74 57v-31M-1 57v-37M25 57v-37M91 57v-29" class="thin" stroke-width="4"/>
    <path d="M-126 17h72M-18 10h65M63 18h66" fill="none" stroke="#2b5a57" stroke-width="9"/>
    <path d="M-118 17h56M-10 10h49M71 18h50" fill="none" stroke="#f4ecd8" stroke-width="3" stroke-dasharray="5 5"/>
    <path d="M-107 84h214" class="thin" stroke-width="5"/>
    <circle cx="0" cy="18" r="43" class="pin-ring"/>
  </g>
  <text x="216" y="1168" text-anchor="middle" class="label">보정동 카페거리</text>
  <text x="216" y="1194" text-anchor="middle" class="micro">CAFE STREET · RIVERSIDE</text>

  <!-- lower right: art hall miniature -->
  <g id="lm-artshall" transform="translate(684 1040)">
    <title>용인포은아트홀</title>
    <ellipse cx="0" cy="62" rx="137" ry="27" fill="#cabb98" opacity=".5"/>
    <path d="M-121 58V-16Q0-100 121-16V58z" class="building"/>
    <path d="M-106 5Q0-73 106 5" fill="none" stroke="#a8894e" stroke-width="19"/>
    <path d="M-70 58V10Q0-34 70 10V58z" class="teal"/>
    <path d="M-55 23Q0-5 55 23" fill="none" stroke="#f4ecd8" stroke-width="4"/>
    <path d="M-138 74h276" class="thin" stroke-width="5"/>
    <path d="M-119 88h238" class="thin" stroke="#a8894e" stroke-width="4"/>
    <circle cx="0" cy="13" r="43" class="pin-ring"/>
  </g>
  <text x="684" y="1168" text-anchor="middle" class="label">용인포은아트홀</text>
  <text x="684" y="1194" text-anchor="middle" class="micro">ART HALL · FINAL STOP</text>

  <!-- footer cartouche -->
  <g transform="translate(450 1235)">
    <path d="M-236 0l18-19h400l18 19-18 19h-400z" fill="#e6d9bf" stroke="#372c20" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" class="micro">SCHEMATIC ROUTE · NOT TO SCALE</text>
  </g>
</svg>
