      <path d="M74 264Q204 249 330 269M558 269Q681 252 825 266" class="campus-line" opacity=".45"/>
      <path d="M87 294Q218 304 345 293M556 298Q698 306 827 291" fill="none" stroke="#a8894e" stroke-width="1.5" stroke-dasharray="2 6"/>
