        <path d="M-18-23C-28-25-27-40-17-43C-22-55-7-62 0-55C9-64 23-53 19-44C32-36 24-23 15-23C10-15-1-18-4-22C-10-17-16-18-18-23Z" fill="#a8894e" stroke-width="1.8"/>
        <path d="M-17-34l5-5M-9-46l4-4M8-47l5 3M10-32l7-5M-6-29l4-4" fill="none" stroke="#f4ecd8" stroke-width="1.2"/>
      </g>
      <style>
