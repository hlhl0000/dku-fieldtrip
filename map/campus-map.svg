  <text x="684" y="1168" text-anchor="middle" class="label">용인포은아트홀</text>
  <text x="684" y="1194" text-anchor="middle" class="micro">ART HALL · FINAL STOP</text>

  <!-- footer cartouche -->
  <g transform="translate(450 1235)">
    <path d="M-236 0l18-19h400l18 19-18 19h-400z" fill="#e6d9bf" stroke="#372c20" stroke-width="3"/>
