      </pattern>
      <g id="campus-cypress" stroke="#372c20" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 5V-50" fill="none" stroke-width="2"/>
        <path d="M0-68C-5-56-16-39-13-22C-12-10-5-8 0-9C7-8 14-13 13-25C12-42 5-58 0-68Z" fill="#2b5a57" stroke-width="1.8"/>
