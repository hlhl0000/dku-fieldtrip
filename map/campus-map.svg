<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" width="900" height="1300" role="img" aria-labelledby="mapTitle mapDesc" preserveAspectRatio="xMidYMid meet">
<title id="mapTitle">단국대학교 죽전캠퍼스 현장체험학습 지도</title>
<desc id="mapDesc">빈티지 여행로그풍 손그림 일러스트 지도. 위쪽은 캠퍼스 언덕 위(법화산 능선·단국대 박물관), 가운데는 중앙도서관과 평화의 광장, 아래쪽은 정문과 그 바깥의 죽전역 방면(죽전 포은아트홀·보정동 카페거리·탄천). 방위 정렬 지도가 아니라 오르막 동선 모식도.</desc>

<style>
  .ink   { fill: none; stroke: #6f5f47; stroke-linecap: round; stroke-linejoin: round; }
  .ink2  { fill: none; stroke: #907d5f; stroke-linecap: round; stroke-linejoin: round; }
  .thin  { stroke-width: 1.6; }
  .med   { stroke-width: 2.4; }
  .bold  { stroke-width: 3.4; }
  .wall  { fill: #f3e8cd; stroke: #6f5f47; stroke-width: 2.4; stroke-linejoin: round; }
  .roof  { fill: #cf9057; stroke: #6f5f47; stroke-width: 2.4; stroke-linejoin: round; }
  .roof2 { fill: #b0703c; stroke: #6f5f47; stroke-width: 2.4; stroke-linejoin: round; }
  .leaf  { fill: #8ea578; stroke: #5f7550; stroke-width: 1.8; stroke-linejoin: round; }
  .leaf2 { fill: #9db089; stroke: #5f7550; stroke-width: 1.8; stroke-linejoin: round; }
  .trunk { fill: none; stroke: #8a6b46; stroke-width: 3; stroke-linecap: round; }
  .t     { font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Nanum Gothic','Helvetica Neue',sans-serif; }
  .lbl   { font-size: 25px; font-weight: 700; fill: #5d4d38; text-anchor: middle;
           paint-order: stroke; stroke: #f5edd8; stroke-width: 6px; stroke-linejoin: round; }
  .sub   { font-size: 17px; font-weight: 600; fill: #8a7757; text-anchor: middle;
           paint-order: stroke; stroke: #f5edd8; stroke-width: 5px; stroke-linejoin: round; }
  .tiny  { font-size: 15px; font-weight: 600; fill: #988563; text-anchor: middle;
           paint-order: stroke; stroke: #f5edd8; stroke-width: 4px; stroke-linejoin: round; }
  .ttl   { font-size: 40px; font-weight: 800; fill: #fdf6e3; text-anchor: middle; letter-spacing: 1.5px; }
  .ttl2  { font-size: 18px; font-weight: 700; fill: #f3d9bd; text-anchor: middle; letter-spacing: 5px; }
  .path  { fill: none; stroke: #b0713f; stroke-width: 5; stroke-linecap: round;
           stroke-dasharray: 2 15; opacity: .85; }
  .water { fill: none; stroke: #86adba; stroke-linecap: round; stroke-linejoin: round; }
</style>

<defs>
