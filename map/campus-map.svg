      <use href="#campus-cypress" transform="translate(84 253) scale(.78)"/>
      <use href="#campus-oak" transform="translate(301 247) scale(.86)"/>
      <use href="#campus-cypress" transform="translate(331 260) scale(.8)"/>
      <use href="#campus-cypress" transform="translate(557 253) scale(.77)"/>
      <use href="#campus-oak" transform="translate(795 252) scale(.95)"/>
      <use href="#campus-cypress" transform="translate(822 261) scale(.62)"/>
      <path d="M73 259l3-5 3 4M279 259l4-6 4 5M315 268l3-5 3 5M546 261l3-5 3 4M773 263l3-5 3 4M809 270l3-5 3 4" class="campus-line" opacity=".65"/>

