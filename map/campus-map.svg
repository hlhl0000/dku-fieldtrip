          <path d="M57-22L78-34V29L57 39Z" fill="#a8894e" stroke-width="2"/>
          <path d="M57-22L78-34V29L57 39Z" fill="url(#campus-engraving)" stroke="none"/>
          <path d="M-70-22H57V39H-70Z" fill="#f4ecd8" stroke-width="2.5"/>
          <path d="M-70-22H57V39H-70Z" fill="url(#campus-masonry)" stroke="none"/>
          <path d="M-78-23L-54-40H66L84-33 59-16H-78Z" fill="#a8894e" stroke-width="2.5"/>
          <path d="M-77-23H58L81-33M58-23V-16" fill="none" stroke-width="1.5"/>
          <path d="M-58-30H57M-48-35H64" fill="none" stroke="#f4ecd8" stroke-width="1" opacity=".7"/>
          <path d="M-60-10H-40V8H-60ZM-29-10H-9V8H-29ZM2-10H22V8H2ZM33-10H49V8H33Z" fill="#2b5a57" stroke-width="1.5"/>
          <path d="M-50-9V7M-19-9V7M12-9V7M41-9V7" fill="none" stroke="#cabb98" stroke-width="1"/>
          <path d="M-67 14H55M-67 18H55" fill="none" stroke-width="1.2"/>
          <path d="M-59 23H-38V35H-59ZM27 23H48V35H27Z" fill="#cabb98" stroke-width="1.5"/>
          <path d="M-24 39V21H15V39" fill="#2b5a57" stroke-width="1.7"/>
          <path d="M-5 22V38" fill="none" stroke="#cabb98" stroke-width="1.2"/>
          <path d="M-29 39H20L25 44H-34ZM-37 44H28L33 48H-42Z" fill="#e6d9bf" stroke-width="1.5"/>
