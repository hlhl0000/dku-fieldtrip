    <path class="leaf2" d="M19 2 L31 20 L24 20 L34 34 L26 34 L36 45 L2 45 L12 34 L4 34 L14 20 L7 20 Z"/>
  </symbol>
  <symbol id="bush" viewBox="0 0 46 26">
