          <path d="M-13 3V37M-2 3V37M-23 12H10" fill="none" stroke="#cabb98" stroke-width="1.2"/>
          <path d="M-29 39H16L22 44H-35ZM-39 44H26L32 48H-45Z" fill="#e6d9bf" stroke-width="1.5"/>
          <path d="M78-8L84-12V1L78 5ZM78 17L84 13V25L78 29Z" fill="#2b5a57" stroke-width="1"/>
        </g>
      </g>

      <!-- Quiet paper nameplates: explicit CSS size avoids .label overriding font-size attributes. -->
      <path d="M70 270H280L275 288 280 306H70L75 288Z" fill="#f4ecd8" stroke="#a8894e" stroke-width="1.1"/>
      <path d="M535 270H785L780 288 785 306H535L540 288Z" fill="#f4ecd8" stroke="#a8894e" stroke-width="1.1"/>
      <text x="175" y="294" class="campus-label">석주선기념박물관</text>
      <text x="660" y="294" class="campus-label">퇴계기념중앙도서관</text>
    </g>
