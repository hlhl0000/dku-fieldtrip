          <path d="M-41-37L-23-52H34L41-47 24-32H-41Z" fill="#2b5a57" stroke-width="2.2"/>
          <path d="M-39-37H24L38-47" fill="none" stroke="#cabb98" stroke-width="1"/>
          <path d="M-73-7H-59V8H-73ZM-51-7H-40V8H-51ZM31-7H45V8H31ZM53-7H64V8H53Z" fill="#2b5a57" stroke-width="1.4"/>
          <path d="M-73 17H-59V31H-73ZM-51 17H-40V31H-51ZM31 17H45V31H31ZM53 17H64V31H53Z" fill="#cabb98" stroke-width="1.4"/>
          <path d="M-66-6V7M-66 18V30M38-6V7M38 18V30" fill="none" stroke="#f4ecd8" stroke-width="1"/>
          <path d="M-82 12H-35M24 12H71M-82 35H-35M24 35H71" fill="none" stroke-width="1.2"/>
          <path d="M-25-22Q-16-26-7-20Q2-26 12-22V-8Q2-12-7-6Q-16-12-25-8Z" fill="#f4ecd8" stroke-width="1.3"/>
          <path d="M-7-20V-7M-21-18l9 2M-21-14l9 2M-2-16l9-2M-2-12l9-2" fill="none" stroke-width=".9"/>
