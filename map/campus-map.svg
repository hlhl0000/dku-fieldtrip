        .campus-label{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Nanum Gothic',sans-serif;font-size:22px;font-weight:700;letter-spacing:-1px;fill:#372c20;text-anchor:middle}
      </style>
    </defs>
    <g clip-path="url(#campus-crop)">
