      <clipPath id="campus-crop"><path d="M64 140H836V312H64Z"/></clipPath>
      <pattern id="campus-engraving" width="6" height="6" patternUnits="userSpaceOnUse">
        <path d="M0 6L6 0" fill="none" stroke="#372c20" stroke-width=".65" opacity=".24"/>
